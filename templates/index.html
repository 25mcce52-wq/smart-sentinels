<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SMART SENTINELS | TEST Camera</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d0f17;
    color: #e8edf7;
    font-family: Arial, Helvetica, sans-serif;
}


/* ============================================================
   HEADER
============================================================ */

.topbar {
    padding: 18px 22px 12px;
    border-bottom: 1px solid #252a38;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    font-size: 25px;
    font-weight: 700;
    color: #67c7ff;
}

.brand span {
    color: #9aa4b8;
    font-size: 17px;
    font-weight: 500;
}

.live {
    background: #62df7d;
    color: #07100a;
    padding: 7px 13px;
    border-radius: 5px;
    font-weight: 700;
    font-size: 13px;
}


/* ============================================================
   MAIN LAYOUT
============================================================ */

.layout {
    display: grid;

    grid-template-columns:
        minmax(0, 3.1fr)
        minmax(300px, 1fr);

    gap: 14px;

    padding: 17px;
}


/* ============================================================
   CAMERA CARD
============================================================ */

.camera-card,
.log-card,
.controlbar {
    background: #171b26;
    border: 1px solid #2b3243;
    border-radius: 9px;
}

.camera-card {
    padding: 12px;
}

.camera-head {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 9px;

    gap: 8px;
}

.camera-title {
    font-size: 17px;
    font-weight: 700;
}

.camera-title span {
    color: #67c7ff;
    font-weight: 500;
}

.camera-buttons {
    display: flex;
    gap: 6px;
}


/* ============================================================
   BUTTONS
============================================================ */

button {
    border: 0;
    border-radius: 5px;

    padding: 9px 14px;

    background: #293141;
    color: #e8edf7;

    font-weight: 700;

    cursor: pointer;
}

button:hover {
    filter: brightness(1.15);
}

.camera-buttons button {
    padding: 6px 10px;
    font-size: 12px;
}


/* ============================================================
   CAMERA VIDEO
============================================================ */

.camera-stage {
    position: relative;

    width: 100%;

    background: #000;

    border: 1px solid #30384a;

    border-radius: 5px;

    overflow: hidden;

    line-height: 0;
}

.camera-stage img {
    display: block;

    width: 100%;

    height: auto;

    min-height: 350px;

    object-fit: contain;

    background: #000;
}


/* ============================================================
   ZONE CANVAS
============================================================ */

.zone-canvas {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    cursor: crosshair;

    pointer-events: none;
}

.camera-stage.drawing .zone-canvas {
    pointer-events: auto;
}


/* ============================================================
   ZONE MESSAGE
============================================================ */

.zone-hint {
    min-height: 28px;

    padding-top: 8px;

    color: #8793aa;

    font-size: 12px;
}


/* ============================================================
   INCIDENT LOG
============================================================ */

.log-card {
    padding: 13px;

    height: fit-content;

    max-height:
        calc(100vh - 105px);

    overflow: hidden;
}

.log-title {
    color: #ff6666;

    font-size: 20px;

    font-weight: 700;

    padding:
        6px 0 12px;

    border-bottom:
        1px solid #2b3243;
}

.log-table-head {
    display: grid;

    grid-template-columns:
        78px 1fr;

    color: #8995aa;

    font-size: 12px;

    padding:
        12px 8px 8px;

    border-bottom:
        1px solid #2b3243;
}

.logs {
    max-height:
        calc(100vh - 210px);

    overflow-y: auto;
}

.empty-log {
    color: #66738b;

    text-align: center;

    padding: 35px 10px;

    font-size: 13px;
}

.log-item {
    display: grid;

    grid-template-columns:
        78px 1fr;

    gap: 8px;

    padding: 12px 8px;

    border-bottom:
        1px solid #282e3c;
}

.log-time {
    color: #b8c1d2;

    font-size: 13px;
}

.log-camera {
    color: #dce6f5;

    font-weight: 700;

    font-size: 13px;
}

.log-event {
    margin-top: 3px;

    color: #eef2f8;

    font-size: 13px;
}

.critical {
    display: inline-block;

    margin-top: 5px;

    padding: 3px 6px;

    border-radius: 4px;

    background: #ef4351;

    color: white;

    font-size: 10px;

    font-weight: 700;
}

.confidence {
    display: block;

    margin-top: 5px;

    color: #8391aa;

    font-size: 11px;
}


/* ============================================================
   CONTROL BAR
============================================================ */

.controlbar {
    margin-top: 14px;

    padding: 12px;

    display: flex;

    align-items: center;

    gap: 8px;

    flex-wrap: wrap;
}

.status-btn {
    min-width: 138px;
}

.detect-on {
    background: #69df7e;
    color: #061009;
}

.detect-off {
    background: #6d7482;
    color: white;
}

.alarm-on {
    background: #ffba43;
    color: #171009;
}

.night {
    background: #303847;
    color: #70e589;
}

.system-message {
    color: #7f8ca4;

    font-size: 12px;

    margin-left: 4px;
}


/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 950px) {

    .layout {
        grid-template-columns: 1fr;
    }

    .log-card {
        max-height: 500px;
    }

    .logs {
        max-height: 380px;
    }
}

@media (max-width: 700px) {

    .camera-head {
        align-items: flex-start;

        flex-direction: column;
    }

    .camera-buttons {
        width: 100%;
    }

    .camera-buttons button {
        flex: 1;
    }
}

</style>

</head>


<body>


<!-- ============================================================
     HEADER
============================================================ -->

<header class="topbar">

    <span class="brand">
        SMART SENTINELS
        <span>| AI Border Surveillance</span>
    </span>

    <span class="live">
        SYSTEM LIVE
    </span>

</header>


<!-- ============================================================
     MAIN
============================================================ -->

<main class="layout">


<section>


<!-- ============================================================
     TEST CAMERA
============================================================ -->

<div class="camera-card">

    <div class="camera-head">

        <div class="camera-title">

            CAM-02:
            <span>TEST</span>

        </div>


        <div class="camera-buttons">

            <button
                onclick="startZone()"
            >
                Set Zone
            </button>

            <button
                onclick="finishZone()"
            >
                Finish
            </button>

            <button
                onclick="clearZone()"
            >
                Clear Zone
            </button>

        </div>

    </div>


    <div
        class="camera-stage"
        id="stage"
    >

        <img
            id="video"
            src="/video_feed"
            alt="TEST Camera"
        >

        <canvas
            id="canvas"
            class="zone-canvas"
        ></canvas>

    </div>


    <div
        class="zone-hint"
        id="hint"
    >
        Draw a restricted zone before detection can run.
    </div>

</div>


<!-- ============================================================
     CONTROLS
============================================================ -->

<div class="controlbar">

    <button
        id="detectionButton"
        class="status-btn detect-on"
        onclick="toggleDetection()"
    >
        AI Detection: ON
    </button>


    <button
        id="alarmButton"
        class="status-btn"
        onclick="toggleAlarm()"
    >
        🔊 System Alarm: OFF
    </button>


    <button
        id="nightButton"
        class="status-btn night"
        onclick="toggleNight()"
    >
        🌙 Night Vision Filter
    </button>


    <span
        id="systemMessage"
        class="system-message"
    >
        Draw a zone before detection can run.
    </span>

</div>


</section>


<!-- ============================================================
     INCIDENT LOG
============================================================ -->

<aside class="log-card">

    <div class="log-title">
        Incident Alert Log
    </div>


    <div class="log-table-head">

        <div>
            Time
        </div>

        <div>
            Event Log
        </div>

    </div>


    <div
        id="logs"
        class="logs"
    >

        <div class="empty-log">
            No incidents yet. Monitoring camera...
        </div>

    </div>

</aside>


</main>


<script>


/* ============================================================
   ZONE
============================================================ */

let zones = [];

let drawing = false;


/* ============================================================
   CANVAS
============================================================ */

function resizeCanvas() {

    const stage =
        document.getElementById(
            "stage"
        );

    const canvas =
        document.getElementById(
            "canvas"
        );

    if (!stage || !canvas) {
        return;
    }


    const rect =
        stage.getBoundingClientRect();


    const oldZones =
        zones;


    canvas.width =
        Math.max(
            1,
            Math.round(rect.width)
        );

    canvas.height =
        Math.max(
            1,
            Math.round(rect.height)
        );


    drawZoneCanvas(
        oldZones
    );
}


/* ============================================================
   DRAW ZONE
============================================================ */

function drawZoneCanvas(
    points = zones
) {

    const canvas =
        document.getElementById(
            "canvas"
        );

    if (!canvas) {
        return;
    }


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (
        !points ||
        points.length === 0
    ) {
        return;
    }


    const px =
        points.map(
            p => ({
                x:
                    p.x *
                    canvas.width,

                y:
                    p.y *
                    canvas.height
            })
        );


    if (px.length >= 3) {

        ctx.beginPath();

        ctx.moveTo(
            px[0].x,
            px[0].y
        );


        for (
            let i = 1;
            i < px.length;
            i++
        ) {

            ctx.lineTo(
                px[i].x,
                px[i].y
            );
        }


        ctx.closePath();


        ctx.fillStyle =
            "rgba(255, 0, 0, 0.12)";

        ctx.fill();


        ctx.strokeStyle =
            "#ff3d2e";

        ctx.lineWidth = 3;

        ctx.stroke();

    } else {

        ctx.strokeStyle =
            "#ff3d2e";

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(
            px[0].x,
            px[0].y
        );


        for (
            let i = 1;
            i < px.length;
            i++
        ) {

            ctx.lineTo(
                px[i].x,
                px[i].y
            );

        }

        ctx.stroke();
    }


    px.forEach(
        (p, i) => {

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                5,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#ff3d2e";

            ctx.fill();


            ctx.fillStyle =
                "#ffffff";

            ctx.font =
                "11px Arial";

            ctx.fillText(
                String(i + 1),
                p.x + 8,
                p.y - 8
            );

        }
    );
}


/* ============================================================
   START ZONE
============================================================ */

function startZone() {

    drawing = true;

    zones = [];


    const stage =
        document.getElementById(
            "stage"
        );

    stage.classList.add(
        "drawing"
    );


    resizeCanvas();

    drawZoneCanvas();


    document.getElementById(
        "hint"
    ).textContent =
        "Click on the video to add zone points. Add at least 3 points, then click Finish.";


    document.getElementById(
        "systemMessage"
    ).textContent =
        "CAM-02: drawing restricted zone...";
}


/* ============================================================
   ADD ZONE POINT
============================================================ */

async function addZonePoint(
    event
) {

    if (!drawing) {
        return;
    }


    const canvas =
        document.getElementById(
            "canvas"
        );


    const rect =
        canvas.getBoundingClientRect();


    const x =
        Math.max(
            0,
            Math.min(
                1,
                (
                    event.clientX -
                    rect.left
                ) /
                rect.width
            )
        );


    const y =
        Math.max(
            0,
            Math.min(
                1,
                (
                    event.clientY -
                    rect.top
                ) /
                rect.height
            )
        );


    if (zones.length >= 20) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/add_point",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            {
                                cam_id: "2",
                                x_percent: x,
                                y_percent: y
                            }
                        )
                }
            );


        const data =
            await response.json();


        if (
            data.status ===
            "success"
        ) {

            zones.push({
                x: x,
                y: y
            });


            drawZoneCanvas();


            document.getElementById(
                "hint"
            ).textContent =
                `${data.points} zone point(s). Add at least 3 points and click Finish.`;
        }

    } catch (error) {

        console.error(
            "Zone point error:",
            error
        );

    }
}


/* ============================================================
   FINISH ZONE
============================================================ */

function finishZone() {

    drawing = false;


    document.getElementById(
        "stage"
    ).classList.remove(
        "drawing"
    );


    if (zones.length < 3) {

        document.getElementById(
            "hint"
        ).textContent =
            "At least 3 points are required.";

        document.getElementById(
            "systemMessage"
        ).textContent =
            "CAM-02: zone needs at least 3 points.";

        return;
    }


    drawZoneCanvas();


    document.getElementById(
        "hint"
    ).textContent =
        `Restricted zone active (${zones.length} points). Detection is limited to this zone.`;


    document.getElementById(
        "systemMessage"
    ).textContent =
        "CAM-02 TEST zone finished. Detection is active when AI Detection is ON.";
}


/* ============================================================
   CLEAR ZONE
============================================================ */

async function clearZone() {

    drawing = false;

    zones = [];


    document.getElementById(
        "stage"
    ).classList.remove(
        "drawing"
    );


    drawZoneCanvas();


    try {

        await fetch(
            "/api/clear_zone",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        cam_id: "2"
                    })
            }
        );

    } catch (error) {

        console.error(
            "Clear zone error:",
            error
        );

    }


    document.getElementById(
        "hint"
    ).textContent =
        "No restricted zone configured. Detection is disabled.";


    document.getElementById(
        "systemMessage"
    ).textContent =
        "CAM-02 zone cleared. Detection will not run.";
}


/* ============================================================
   DETECTION
============================================================ */

async function toggleDetection() {

    try {

        const response =
            await fetch(
                "/api/toggle_detection",
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        updateDetectionButton(
            data.detection_enabled
        );

    } catch (error) {

        console.error(
            "Detection toggle error:",
            error
        );

    }
}


function updateDetectionButton(
    on
) {

    const button =
        document.getElementById(
            "detectionButton"
        );


    button.textContent =
        `AI Detection: ${
            on ? "ON" : "OFF"
        }`;


    button.classList.toggle(
        "detect-on",
        on
    );


    button.classList.toggle(
        "detect-off",
        !on
    );
}


/* ============================================================
   ALARM
============================================================ */

async function toggleAlarm() {

    try {

        const response =
            await fetch(
                "/api/toggle_alarm",
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        const button =
            document.getElementById(
                "alarmButton"
            );


        button.textContent =
            `🔊 System Alarm: ${
                data.alarm_enabled
                ? "ON"
                : "OFF"
            }`;


        button.classList.toggle(
            "alarm-on",
            data.alarm_enabled
        );

    } catch (error) {

        console.error(
            "Alarm toggle error:",
            error
        );

    }
}


/* ============================================================
   NIGHT FILTER
============================================================ */

async function toggleNight() {

    try {

        const response =
            await fetch(
                "/api/toggle_night",
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        const button =
            document.getElementById(
                "nightButton"
            );


        button.textContent =
            data.night_mode
            ? "☀️ Night Vision Filter: ON"
            : "🌙 Night Vision Filter";


    } catch (error) {

        console.error(
            "Night mode error:",
            error
        );

    }
}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(
    value
) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


/* ============================================================
   ALERTS
============================================================ */

function renderAlerts(
    alerts
) {

    const container =
        document.getElementById(
            "logs"
        );


    if (
        !alerts ||
        alerts.length === 0
    ) {

        container.innerHTML =
            '<div class="empty-log">No incidents yet. Monitoring camera...</div>';

        return;
    }


    container.innerHTML =
        alerts.map(
            alert => `

            <div class="log-item">

                <div class="log-time">
                    ${escapeHtml(
                        alert.time || ""
                    )}
                </div>

                <div>

                    <div class="log-camera">
                        ${escapeHtml(
                            alert.camera || ""
                        )}
                    </div>

                    <div class="log-event">
                        ${escapeHtml(
                            alert.event || ""
                        )}
                    </div>

                    <span class="critical">
                        ${escapeHtml(
                            alert.severity ||
                            "CRITICAL"
                        )}
                    </span>

                    <span class="confidence">
                        Confidence:
                        ${
                            Number(
                                alert.confidence ||
                                0
                            ).toFixed(1)
                        }%
                    </span>

                </div>

            </div>

        `
        ).join("");
}


/* ============================================================
   LOAD ALERTS
============================================================ */

async function loadAlerts() {

    try {

        const response =
            await fetch(
                "/api/alerts",
                {
                    cache:
                        "no-store"
                }
            );


        if (response.ok) {

            renderAlerts(
                await response.json()
            );

        }

    } catch (error) {

        console.error(
            "Alert refresh error:",
            error
        );

    }
}


/* ============================================================
   DETECTION STATUS
============================================================ */

async function loadDetectionStatus() {

    try {

        const response =
            await fetch(
                "/api/detection_status",
                {
                    cache:
                        "no-store"
                }
            );


        if (response.ok) {

            const data =
                await response.json();


            updateDetectionButton(
                data.detection_enabled
            );

        }

    } catch (error) {

        console.error(
            "Detection status error:",
            error
        );

    }
}


/* ============================================================
   ZONE STATUS
============================================================ */

async function loadZoneStatus() {

    try {

        const response =
            await fetch(
                "/api/zone_status",
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        const item =
            data["2"];


        if (!item) {
            return;
        }


        if (
            !drawing &&
            item.points === 0 &&
            zones.length > 0
        ) {

            zones = [];

            drawZoneCanvas();
        }


        if (
            item.ready &&
            !drawing
        ) {

            document.getElementById(
                "hint"
            ).textContent =
                `Restricted zone active (${item.points} points). Detection is limited to this zone.`;
        }

    } catch (error) {

        console.error(
            "Zone status error:",
            error
        );

    }
}


/* ============================================================
   DIAGNOSTICS
============================================================ */

async function loadDiagnostics() {

    try {

        const response =
            await fetch(
                "/api/diagnostics",
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        const d =
            data["2"];


        if (
            d &&
            d.zone_ready &&
            d.detection_enabled
        ) {

            document.getElementById(
                "systemMessage"
            ).textContent =
                `CAM-02 TEST: ${d.raw_objects} detected / ${d.objects_in_zone} in zone`;
        }

    } catch (error) {

        console.error(
            "Diagnostics error:",
            error
        );

    }
}


/* ============================================================
   CANVAS EVENTS
============================================================ */

const canvas =
    document.getElementById(
        "canvas"
    );


canvas.addEventListener(
    "click",
    event => {
        addZonePoint(event);
    }
);


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
    "resize",
    () => {
        resizeCanvas();
    }
);


document.getElementById(
    "video"
).addEventListener(
    "load",
    () => {
        resizeCanvas();
    }
);


/* ============================================================
   START
============================================================ */

resizeCanvas();

loadAlerts();

loadDetectionStatus();

loadZoneStatus();


setInterval(
    loadAlerts,
    1000
);


setInterval(
    loadZoneStatus,
    1500
);


setInterval(
    loadDiagnostics,
    2000
);

</script>

</body>

</html>
